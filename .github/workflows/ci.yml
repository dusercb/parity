# The full offline test suite. signal_core comes from the backtester, so CI checks
# Hindsight out next to this repo exactly as the bot expects it on a real machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Hindsight next to this repo
        run: git clone --depth 1 https://github.com/dusercb/hindsight ../hindsight
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../hindsight/ibkr_premarket_backtester/requirements.txt -r requirements.txt
      - name: Pytest (full suite)
        run: python -m pytest -q
